name: Deploy web build

# Publishes both editions to GitHub Pages: the Three.js build at the root, and the Godot
# GDScript web export at /godot/. One link, two engines, no download and no install.
# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Fetch Godot for the GDScript web build
        working-directory: .
        continue-on-error: true
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -fL -o godot.zip "${base}/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v4.7.2-stable_linux.x86_64 godot && chmod +x godot
          curl -fL -o templates.tpz "${base}/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Export the GDScript edition into /godot
        working-directory: .
        continue-on-error: true
        run: |
          set -euo pipefail
          P=engines/godot-gdscript/LunaQuest.GDScript
          bash tools/sync-gdscript-assets.sh
          mkdir -p "$P/build/web"
          ./godot --headless --path "$P" --import || true
          ./godot --headless --path "$P" --export-release "Web" build/web/index.html
          test -f "$P/build/web/index.wasm"
          mkdir -p web/dist/godot
          cp -R "$P/build/web/." web/dist/godot/
      - name: Link the two editions from the title page
        working-directory: .
        run: |
          node -e '
            const fs = require("fs");
            const file = "web/dist/index.html";
            let html = fs.readFileSync(file, "utf8");
            if (fs.existsSync("web/dist/godot/index.html")) {
              const badge = "<a href=\"./godot/\" style=\"position:fixed;right:14px;bottom:14px;z-index:9999;"
                + "padding:10px 14px;border-radius:6px;background:#e08a3c;color:#10141b;font:600 14px/1.2 system-ui,sans-serif;"
                + "text-decoration:none\">Play the Godot GDScript build &rarr;</a>";
              html = html.replace("</body>", badge + "</body>");
              fs.writeFileSync(file, html);
            }
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
