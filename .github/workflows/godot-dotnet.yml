name: Godot .NET build

# The C# edition of the game (Godot .NET, C#) is compiled here, on every push and pull request:
# the project's C# is built against the real Godot API, the project is imported headlessly and a
# few hundred frames are run, so a typo in a script cannot reach main. The GDScript workflow does
# the same for the other Godot edition; `ci.yml` covers content, the shared simulation, engine
# parity and the immutable asset locks.
#
# This job exists because a script that has never been compiled is not verified. It needs no
# licence, no GPU and no editor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  DOTNET_VERSION: '8.0.x'
  PROJECT_DIR: engines/godot/LunaQuest.Godot

jobs:
  build:
    name: Compile and run headless
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Annotation helper
        # One annotation, newlines percent-encoded: the Actions log blob host is not reachable
        # from every machine, and a check run only keeps ten annotations.
        shell: bash
        run: |
          {
            echo 'annotate() {'
            echo '  local title="$1" body="${2//%/%25}"'
            echo '  body="${body//$'"'"'\r'"'"'/}"'
            echo '  body="${body//$'"'"'\n'"'"'/%0A}"'
            echo '  body="${body//$'"'"'\t'"'"'/ }"'
            echo '  echo "::notice title=${title}::${body}"'
            echo '}'
          } >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build the project's C# against the engine API
        run: |
          set -euo pipefail
          dotnet build "${PROJECT_DIR}/LunaQuest.Godot.csproj" -c Release
          # Godot.NET.Sdk writes the assembly into .godot/mono/temp/bin/<Configuration>/; prove
          # it is there, because a missing assembly makes every script fail to instantiate.
          find "${PROJECT_DIR}" -name "LunaQuest.Godot.dll" -printf "built: %p (%s bytes)\n"

      - name: Fetch Godot .NET ${GODOT_VERSION}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" godot-dir
          chmod +x godot-dir/Godot_v*
          # The mono editor finds its own .NET through this variable (tools/godot-mono.sh does
          # the same); without it the C# glue never loads and every script fails to instantiate.
          echo "DOTNET_ROOT=${DOTNET_ROOT:-$(dirname "$(command -v dotnet)")}" >> "$GITHUB_ENV"

      - name: Import the project (loads every script and every asset)
        run: |
          set -euo pipefail
          ./godot-dir/Godot_v* --headless --path "${PROJECT_DIR}" --import > import.log 2>&1 || true
          # The import pass is allowed to warn; a parse or script error is not.
          problems=$(grep -Ei "parse error|script error|failed to load script" import.log || true)
          tail -c 4000 import.log
          annotate "import.log tail" "$(tail -15 import.log)"
          if [ -n "$problems" ]; then
            annotate "import.log errors" "$problems"
            exit 1
          fi

      - name: Run the game headlessly for 400 frames
        run: |
          set -euo pipefail
          ./godot-dir/Godot_v* --headless --path "${PROJECT_DIR}" --quit-after 400 > run.log 2>&1 || true
          problems=$(grep -E "SCRIPT ERROR|Parse Error|Unhandled exception" run.log || true)
          tail -c 4000 run.log
          # Mirror the tail into ONE annotation (GitHub caps a check run at 10 annotations, so
          # one per line would be truncated after the first ten).
          annotate "run.log tail" "$(tail -40 run.log)"
          if [ -n "$problems" ]; then
            annotate "run.log errors" "$problems"
            exit 1
          fi
          # A silent exit 0 proves nothing: the colony has to have actually been built.
          if ! grep -qF "Luna-Quest ready" run.log; then
            echo "::error::run: the game never printed its ready line — the colony did not build"
            exit 1
          fi

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-dotnet-logs
          path: |
            import.log
            run.log
          retention-days: 7
