name: CI

# Every push and pull request: the shared simulation must pass its checks, the content must
# stay consistent, and the three engines must agree. Nothing here needs a GPU or a licence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22'

jobs:
  content:
    name: Content and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate content, crew, incidents and the voice pack
        run: node tools/check-content.mjs

  core:
    name: Shared simulation (C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build the shared core
        run: dotnet build shared/LunaQuest.Core/LunaQuest.Core.csproj -c Release
      - name: Run the 426-check simulation harness
        run: dotnet run --project shared/LunaQuest.Tests/LunaQuest.Tests.csproj -c Release

  parity:
    name: Engine parity and asset locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One simulation, one content set, one Moon
        run: python3 tools/check-engine-parity.py
      - name: Immutable assets (intro film + Cute Astronaut)
        run: bash tools/check-immutable-assets.sh
