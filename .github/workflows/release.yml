name: Release

# Tag a commit and the release builds itself:
#   git tag v3.1 && git push origin v3.1
#
# Outputs, all attached to one GitHub Release:
#   · LunaQuest-v<tag>-Windows.zip — Godot .NET export for Windows
#   · LunaQuest-v<tag>-Linux.zip   — Godot .NET export for Linux
#   · LunaQuest-GDScript-Windows.zip / -Linux.zip — the GDScript desktop exports
#   · LunaQuest-GDScript-Linux-amd64.deb — Debian/Ubuntu package of the GDScript build
#   · LunaQuest-GDScript-Linux-x86_64 — the raw Linux binary the .deb wraps
#   · SHA256SUMS — the SHA-256 of every file attached to the release
#   · the intro film as a shareable MP4
#
# There is no browser build of any kind (H1/A1): v3.4 ships three engines and desktop
# artifacts only.
#
# The engine jobs are allowed to fail without sinking the release (continue-on-error): if the
# Godot toolchain moves or the version needs bumping, only that job goes red and the release
# still publishes the film and the archives that did build.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v3.4); required only when dry_run is false'
        required: false
        default: ''
      dry_run:
        description: 'Build and checksum the artifacts WITHOUT publishing a GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  GODOT_VERSION: '4.7.2'
  DOTNET_VERSION: '8.0.x'

jobs:
  film:
    name: Intro film
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: intro-film
          path: assets/video/intro.mp4

  godot:
    name: Godot exports (Windows, Linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Fetch Godot .NET and the mono export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" godot-dir
          curl -fL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/"
      - name: Build the C# assemblies
        run: dotnet build engines/godot/LunaQuest.Godot/LunaQuest.Godot.csproj -c Release
      - name: Import assets
        run: |
          set -euo pipefail
          ./godot-dir/Godot_v* --headless --path engines/godot/LunaQuest.Godot --import || true
      - name: Export both desktop builds
        run: |
          set -euo pipefail
          mkdir -p engines/godot/LunaQuest.Godot/build/windows engines/godot/LunaQuest.Godot/build/linux
          ./godot-dir/Godot_v* --headless --path engines/godot/LunaQuest.Godot \
            --export-release "Linux" build/linux/LunaQuest.x86_64
          ./godot-dir/Godot_v* --headless --path engines/godot/LunaQuest.Godot \
            --export-release "Windows Desktop" build/windows/LunaQuest.exe
          chmod +x engines/godot/LunaQuest.Godot/build/linux/LunaQuest.x86_64
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          cd engines/godot/LunaQuest.Godot/build/linux && zip -qr ../../../../../out/LunaQuest-Linux.zip . && cd -
          cd engines/godot/LunaQuest.Godot/build/windows && zip -qr ../../../../../out/LunaQuest-Windows.zip . && cd -
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: godot-builds
          path: out/*.zip
          if-no-files-found: warn

  gdscript:
    name: GDScript exports (Windows, Linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Sync the shared assets into the GDScript project
        run: bash tools/sync-gdscript-assets.sh
      - name: Fetch Godot and the standard export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -fL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          mv templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import the project
        run: |
          set -euo pipefail
          mkdir -p engines/godot-gdscript/LunaQuest.GDScript/build/linux \
                   engines/godot-gdscript/LunaQuest.GDScript/build/windows
          ./godot --headless --path engines/godot-gdscript/LunaQuest.GDScript --import || true
      - name: Export both desktop builds
        run: |
          set -euo pipefail
          ./godot --headless --path engines/godot-gdscript/LunaQuest.GDScript \
            --export-release "Linux" build/linux/luna-quest-gdscript.x86_64
          ./godot --headless --path engines/godot-gdscript/LunaQuest.GDScript \
            --export-release "Windows" build/windows/luna-quest-gdscript.exe
          chmod +x engines/godot-gdscript/LunaQuest.GDScript/build/linux/luna-quest-gdscript.x86_64
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          base="engines/godot-gdscript/LunaQuest.GDScript/build"
          ( cd "$base/linux" && zip -qr "$GITHUB_WORKSPACE/out/LunaQuest-GDScript-Linux.zip" . )
          ( cd "$base/windows" && zip -qr "$GITHUB_WORKSPACE/out/LunaQuest-GDScript-Windows.zip" . )
          # The raw Linux binary plus the Debian package built from it (A7): a release can
          # be installed with dpkg or run directly, and both are checksummed below.
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          ver="${tag#v}"
          if [ -z "$ver" ]; then
            # A dry-run dispatch carries no tag; still build a valid, clearly-marked package.
            ver="0.0.0-1"
          fi
          cp "$base/linux/luna-quest-gdscript.x86_64" out/LunaQuest-GDScript-Linux-x86_64
          bash tools/package-desktop.sh "$base/linux/luna-quest-gdscript.x86_64" "$ver" \
            out/LunaQuest-GDScript-Linux-amd64.deb
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: gdscript-builds
          path: |
            out/*.zip
            out/LunaQuest-GDScript-Linux-amd64.deb
            out/LunaQuest-GDScript-Linux-x86_64
          if-no-files-found: warn

  checksums:
    name: Build SHA256SUMS
    needs: [film, godot, gdscript]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksum every artifact
        # SHA256SUMS covers everything the release will attach, named the way the release
        # page shows it (flat basenames), so a download can be verified with sha256sum -c.
        # This job runs even for a dry-run dispatch, so a rehearsal proves the checksums.
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS
          find . -mindepth 2 -maxdepth 2 -type f | sort | while IFS= read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            ( cd "$dir" && sha256sum "$base" ) >> SHA256SUMS
          done
          cat SHA256SUMS
          # Nothing may be attached without a checksum line.
          missing=0
          while IFS= read -r f; do
            base=$(basename "$f")
            grep -q "  ${base}\$" SHA256SUMS || { echo "no checksum for $base"; missing=1; }
          done < <(find . -mindepth 2 -maxdepth 2 -type f)
          exit $missing
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [film, godot, gdscript, checksums]
    # A manual dispatch is a rehearsal by default: it builds and checks every artifact but
    # never creates a real release. Only an explicit dry_run=false or a real tag push publishes.
    if: always() && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the dispatch tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [ -z "$tag" ]; then
            echo "::error::inputs.tag is required when dry_run is false"
            exit 1
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::inputs.tag must start with 'v' (got '$tag')"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || {
            echo "::error::tag $tag does not exist in this repository"
            exit 1
          }
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show what arrived
        run: find artifacts -type f -printf '%p  %s bytes\n' | sort
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: Luna-Quest ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            **Luna-Quest — The Living Moon Colony**

            Desktop builds are Godot 4 .NET exports. Unzip, then run `LunaQuest.exe` on Windows
            or `./LunaQuest.x86_64` on Linux.

            The `LunaQuest-GDScript-*` archives are the same game built from the pure-GDScript
            project with stock Godot 4.7.2 — no .NET runtime needed anywhere. On Debian or
            Ubuntu install it with `sudo dpkg -i LunaQuest-GDScript-Linux-amd64.deb`, or run
            `LunaQuest-GDScript-Linux-x86_64` directly (it needs `chmod +x` first).

            `SHA256SUMS` lists the SHA-256 of every other file attached to this release.

            The intro film is the original render of the game world and is included unchanged.

            Saved games use schema 2 and are interchangeable between the Godot .NET, GDScript
            and Unity builds. The simulation is deterministic at a one-second step.
          files: |
            artifacts/godot-builds/*.zip
            artifacts/gdscript-builds/*.zip
            artifacts/gdscript-builds/*.deb
            artifacts/gdscript-builds/*.x86_64
            artifacts/intro-film/*.mp4
            artifacts/checksums/SHA256SUMS
