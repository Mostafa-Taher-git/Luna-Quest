name: README screenshots

# The frames in docs/screenshots are photographs of the real game, and from v3.4 the game is
# the Godot .NET edition only — there is no browser anywhere in the project (H1/A1), so the
# old Chromium/Playwright capture is gone. The job now runs the game itself: build the C#,
# give it a virtual display, and let Main.cs's capture flags do the rest through
# tools/capture-screenshots.sh. Manual trigger only, so a push never pays for it.
#
#   gh workflow run screenshots.yml --ref <branch>
#   gh run download <id> -n readme-shots -D shots

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only capture frames whose name contains this text (blank = all)'
        required: false
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: '4.7.2'
  DOTNET_VERSION: '8.0.x'
  PROJECT_DIR: engines/godot/LunaQuest.Godot

jobs:
  capture:
    name: Capture frames
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch Godot .NET ${GODOT_VERSION}
        # Same recipe as godot-dotnet.yml, including DOTNET_ROOT: the mono editor finds its
        # own .NET through it, and without the C# glue no script (not even the capture flags)
        # would instantiate.
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64" godot-dir
          chmod +x godot-dir/Godot_v*
          echo "DOTNET_ROOT=${DOTNET_ROOT:-$(dirname "$(command -v dotnet)")}" >> "$GITHUB_ENV"
          echo "GODOT=${PWD}/godot-dir/Godot_v${GODOT_VERSION}-stable_mono.x86_64" >> "$GITHUB_ENV"

      - name: Install the virtual display and Pillow
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth python3-pil

      - name: Capture the frames
        run: |
          set -euo pipefail
          tools/capture-screenshots.sh ${{ inputs.only }}

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-shots
          path: docs/screenshots
          retention-days: 14

      - name: Commit the frames back to the branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Luna-Quest capture"
          git config user.email "capture@luna-quest.invalid"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Capture README frames from ${GITHUB_SHA::7} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summarise
        if: always()
        run: |
          {
            echo '### README frames'
            echo ''
            echo '| Frame | Size |'
            echo '|---|---|'
            for f in docs/screenshots/*.png; do
              [ -f "$f" ] || continue
              bytes=$(stat -c %s "$f")
              dim=$(python3 -c "from PIL import Image;print('x'.join(map(str,Image.open('$f').size)))" 2>/dev/null || echo '?')
              echo "| ${f#docs/screenshots/} | ${dim} · $((bytes / 1024)) kB |"
            done
            echo ''
            echo 'Artifact: `readme-shots`'
          } >> "$GITHUB_STEP_SUMMARY"
