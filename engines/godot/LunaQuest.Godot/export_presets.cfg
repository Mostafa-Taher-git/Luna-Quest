; Luna-Quest — Godot 4 .NET export presets.
;
; Committed on purpose: the release workflow runs these headlessly. Both presets bundle the
; C# assemblies, the JSON content in data/ and the art in assets/. There is deliberately no
; Web preset: Godot cannot export a C# project to the browser, which is exactly why this
; repository also ships a native browser build under web/.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, assets/astronaut/*.glb, assets/models/**/*.glb, assets/real/**/*, assets/video/*.ogv, assets/audio/**/*.mp3, assets/*.woff"
exclude_filter=""
export_path="build/windows/LunaQuest.exe"
patches=PackedStringArray()
encryption_include_folders=""
encryption_exclude_folders=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="Luna-Quest"
application/product_name="Luna-Quest"
application/file_description="Luna-Quest — The Living Moon Colony"
application/copyright="MIT. Art under its own licences; see CREDITS.md."
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=true

