<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="t d">
<title id="t">Canadian Space Agency resources mapped to Luna Academy gameplay</title><desc id="d">A systems architecture diagram mapping CSA resource themes to Luna Academy world simulation, NPCs and player learning outcomes.</desc>
