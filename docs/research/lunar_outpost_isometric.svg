<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#142c43"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#8b929d"/><stop offset="1" stop-color="#4b5667"/></linearGradient>
